services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: npm_alert_triage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d npm_alert_triage" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
